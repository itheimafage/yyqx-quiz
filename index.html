<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.topbar{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.topbar h1{font-size:1.3rem;font-weight:600}
.topbar .stats{display:flex;gap:16px;font-size:.85rem}
.topbar .stats span{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;white-space:nowrap}
.filter-bar{background:#fff;padding:12px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #e8e8e8}
.filter-bar label{font-size:.85rem;color:#666;white-space:nowrap}
.filter-bar select,.filter-bar button{padding:8px 14px;border:1px solid #d9d9d9;border-radius:8px;font-size:.85rem;background:#fff;cursor:pointer;transition:all .2s}
.filter-bar select:hover,.filter-bar button:hover{border-color:#4a6cf7}
.filter-bar select:focus{outline:none;border-color:#4a6cf7;box-shadow:0 0 0 2px rgba(74,108,247,.2)}
.btn-random{background:#4a6cf7!important;color:#fff!important;border:none!important;font-weight:500}
.btn-random:hover{background:#3b5de7!important}
.btn-reset{background:#fff;color:#e74c3c;border-color:#e74c3c!important}
.btn-reset:hover{background:#fff5f5}
.main{max-width:900px;margin:0 auto;padding:24px 16px}
.q-card{background:#fff;border-radius:14px;padding:28px 32px;margin-bottom:20px;box-shadow:0 1px 6px rgba(0,0,0,.06);transition:all .3s}
.q-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.q-badge{background:linear-gradient(135deg,#4a6cf7,#6c8cff);color:#fff;padding:4px 12px;border-radius:6px;font-size:.8rem;font-weight:600}
.q-num{font-size:.85rem;color:#999}
.q-type{display:inline-block;background:#f0f5ff;color:#4a6cf7;padding:2px 10px;border-radius:4px;font-size:.75rem}
.q-stem{font-size:1.05rem;line-height:1.85;color:#2c3e50;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border:2px solid #e8e8e8;border-radius:10px;cursor:pointer;transition:all .2s;font-size:.95rem;line-height:1.6;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:#b8c8ff;background:#f8faff}
.opt.selected{border-color:#4a6cf7;background:#f0f5ff}
.opt.correct{border-color:#27ae60!important;background:#eafaf1!important}
.opt.wrong{border-color:#e74c3c!important;background:#fdf0ef!important}
.opt.correct .opt-letter{background:#27ae60!important;color:#fff}
.opt.wrong .opt-letter{background:#e74c3c!important;color:#fff}
.opt-letter{width:32px;height:32px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0;transition:all .2s}
.opt.selected .opt-letter{background:#4a6cf7;color:#fff}
.opt-text{flex:1}
.feedback{margin-top:16px;padding:14px 18px;border-radius:8px;font-size:.9rem;display:none}
.feedback.show{display:block}
.feedback.ok{background:#eafaf1;color:#1e7e34;border:1px solid #a3d9b1}
.feedback.err{background:#fdf0ef;color:#b03a2e;border:1px solid #f5b7b1}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px;flex-wrap:wrap}
.nav button{padding:12px 24px;border-radius:10px;font-size:.95rem;font-weight:500;cursor:pointer;transition:all .2s;border:none}
.btn-prev{background:#e8e8e8;color:#555}
.btn-prev:hover{background:#ddd}
.btn-next{background:#4a6cf7;color:#fff}
.btn-next:hover{background:#3b5de7}
.btn-answer{background:#fff;color:#4a6cf7;border:2px solid #4a6cf7!important}
.btn-answer:hover{background:#f0f5ff}
.progress-bar{height:6px;background:#e8e8e8;border-radius:3px;margin:20px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4a6cf7,#6c8cff);border-radius:3px;transition:width .3s}
.summary{background:#fff;border-radius:14px;padding:32px;margin-top:24px;box-shadow:0 1px 6px rgba(0,0,0,.06);display:none}
.summary.show{display:block}
.summary h2{font-size:1.3rem;margin-bottom:20px;color:#1a1a2e}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:24px}
.summary-item{text-align:center;padding:20px;border-radius:12px;background:#f8f9fa}
.summary-item .num{font-size:2rem;font-weight:700}
.summary-item .label{font-size:.85rem;color:#888;margin-top:4px}
.summary-item.ok-bg{background:#eafaf1}
.summary-item.ok-bg .num{color:#27ae60}
.summary-item.err-bg{background:#fdf0ef}
.summary-item.err-bg .num{color:#e74c3c}
.hw-breakdown{margin-top:20px}
.hw-breakdown h3{font-size:1rem;margin-bottom:12px;color:#555}
.hw-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;margin-bottom:6px;background:#fafafa}
.hw-row .hw-name{font-weight:600;min-width:90px}
.hw-row .hw-bar{flex:1;height:10px;background:#e8e8e8;border-radius:5px;overflow:hidden}
.hw-row .hw-fill{height:100%;border-radius:5px;transition:width .3s}
.hw-row .hw-score{font-size:.85rem;color:#888;min-width:60px;text-align:right}
.empty{text-align:center;padding:60px 20px;color:#999}
.empty .icon{font-size:3rem;margin-bottom:16px}
@media(max-width:600px){.q-card{padding:20px 16px}.topbar{padding:12px 16px}.topbar h1{font-size:1.1rem}.filter-bar{padding:10px 16px}}
</style>

<script>

const Q=[{"id": 1, "homework": 1, "homework_name": "课后作业1", "number": 1, "stem": "当前，人们往往简单地将“积极老龄化”理解为“老有所为”，但其真正含义远 超过后者。通常，我国“老有所为”的主体主要是老干部、老专业科技人才、老知识分 子等，但他们只是老年人中的一部分。“积极老龄化”是面向全体老年人群体的，不仅 老干部、老知识分子要“积极老龄化”，普通老人也要“积极老龄化”。“老有所为” 着重强调老人“参与”的一面，“积极老龄化”还强调“健康”和“保障”以及三者之 间有机统一和结合，参与社会仅是“积极老龄化”的一个方面。 这段文字意在阐明：", "options": {"A": "“积极老龄化”比“老有所为”内涵更丰富", "B": "“老有所为”和“积极老龄化”的主体不同", "C": "“老有所为”比“积极老龄化”更重视参与", "D": "“积极老龄化”概念长期被误读的根本原因"}, "answer": "A"}, {"id": 2, "homework": 1, "homework_name": "课后作业1", "number": 2, "stem": "标语口号反映了一个国家的文明程度，标语不应该只是板着面孔告诉人们不应该 做什么，而应该用善意的语言引人向善。在语气和修辞上，口号的制定者应该多下功夫。 放眼西方，充满人文关怀的口号不胜枚举。如美国某妇产医院正厅标语：“我们在爱中 生长，爱也在我们中生长”；美国某老年公寓大厅内的标语：“爱一个人要付出很大代 价，但不爱任何人时，代价就更大”。 这段文字意在说明：", "options": {"A": "引人向善的标语口号的运用可以体现一个国家的文明程度更高", "B": "如何将标语口号设计得更人文、更合理需要制定者深入地思考", "C": "在标语口号设计上西方国家经常会将更多的人文关怀融入其中", "D": "美国为代表的西方国家在标语口号设计上比东方国家更胜一筹"}, "answer": "B"}, {"id": 3, "homework": 1, "homework_name": "课后作业1", "number": 3, "stem": "清明祭祀，向已逝的祖先亲人送上思念与敬意，更多的是传承中华民族的孝道传 统，把对逝者的怀念转化为对生者的关怀，祭奠死去的人是为了让活着的人更有尊严地 活着：通过祭祀更加认识自己的人生职责和使命；通过祭礼认识每个人的位置和角色； 通过祭悼来反省人生的终极归宿，来不断校正我们的人生态度和价值。 这段文字主要说明的是：", "options": {"A": "清明节的启示", "B": "应该重视清明节", "C": "清明祭祀的意义", "D": "清明节对于传承文化的作用"}, "answer": "C"}, {"id": 4, "homework": 1, "homework_name": "课后作业1", "number": 4, "stem": "“士”是古代“四民”之首，但是不同时期指称范围并不一致。在周朝的经典著 作中，“士”是用来描述效力于“王”的贵族。“士”最广为接受的定义是“有官职的 人”，公元前 6 世纪之前，官员都是贵族出身。由于出身没落贵族、仕途坎坷、以教育 为职业的孔子就是“士”，这个词的意义逐渐延伸到包括文人在内，指称“知识贵族”， 而不再只强调贵族出身。到了清代，“士”被宽泛地用于描述地方精英的领袖人物，他 们受过教育，拥有财富和影响力，却未必是拥有官位的“绅”。 这段文字意在说明：", "options": {"A": "“士”所指称范围的演变过程", "B": "“士”在古代社会中的崇高地位", "C": "孔子对“士”这个词含义的影响", "D": "作为“士”的贵族阶层的衰落趋势"}, "answer": "A"}, {"id": 5, "homework": 1, "homework_name": "课后作业1", "number": 5, "stem": "从新中国成立后各个历史阶段的流行语，我们可以清晰地看到时代的镜像。“抗 美援朝，大跃进，大炼钢铁，上山下乡，样板戏”等从政治、经济、文化角度反映新中 国成立初到“文革”结束的时代特征。“下海，商品经济，摸着石头过河，特区”等词 语的出现反映了改革开放初期经济思想的大转变。进入 90 年代后，“ok！酷，粉丝” 等外来词汇的音译或直接使用充分体现了外来文化对本土文化的影响，“郁闷，杯具， 给力，蓝瘦香菇”则表达了人们复杂多元的情绪倾向。 这段文字主要说明了：", "options": {"A": "社会结构调整提供了流行语的发展空间", "B": "流行语往往是可变的，流行是短暂的，影响面是广泛的", "C": "流行语既是对真善美的追求，也是远避和猎奇的强烈表现", "D": "流行语是时代价值观的表征，反映着社会群体的普遍心态"}, "answer": "D"}, {"id": 6, "homework": 1, "homework_name": "课后作业1", "number": 6, "stem": "当数字化智能化时代到来之后，将会出现比现在的马云更能“云”的公司。那个 时候的公司，将在坚守其经济属性的基础上，更加突出其社会属性，呈现出社会组织的 突出特征。因为互联网、数字化、云计算、移动终端等技术，一方面为企业赋能，让企 业强大；另一方面也为消费者赋能，让消费者大联合。如果公司不突出社会属性，全心 全意为消费者服务，它就无法持续“经济”下去。比如，一位消费者发现自己购买的汽 车有“天然”缺陷，制造企业就会把同类车召回，否则，消费者就可能不再买它的任何 一款车。 这段文字意在说明：", "options": {"A": "数字化智能化时代将改变公司的基本属性", "B": "社会属性是公司在未来必须凸显的一种特质", "C": "“全心全意为消费者服务”是公司社会属性的核心内容", "D": "智能化极大地提高了广大消费者团结的可能性"}, "answer": "B"}, {"id": 7, "homework": 1, "homework_name": "课后作业1", "number": 7, "stem": "汉字经历甲骨文、金文、小篆、隶书、楷书等字体发展变化，在每种字体的书写 中，都蕴含着丰富的美学价值。龟甲兽骨上清丽瘦硬的甲骨文、青铜器里圆转古朴的金 文、刻石中整齐端庄的篆书，个体字符的线条、结构，整体章法的布局、排列，都表现 出鲜明的审美取向和追求。汉字在实用功能和美学价值的驱动下，形成了中国特有的文 化现象——书法。书法作品中结构的疏密、行笔的缓急，更将汉字的美发挥到极致。 这段文字意在强调：", "options": {"A": "书法在中国传统文化中具有重要地位", "B": "文字是一种具有审美价值的视觉符号", "C": "汉字的形体演变反映了审美取向的变化", "D": "书法充分发挥了汉字所蕴含的美学价值"}, "answer": "D"}, {"id": 8, "homework": 1, "homework_name": "课后作业1", "number": 8, "stem": "在宇宙完成大爆炸的那一刻，物质不断向四面八方飞散，这就是宇宙的膨胀。在 宇宙膨胀的过程中，各种物质的密度存在微弱的差异，这使得宇宙中各个部分的物质在 引力的作用下，朝着附近物质密度稍高一点的地方集中。引力随着物质的集中而逐渐提 高和增大，而引力越大则越会令物质更加集中，这个集中的过程便无法停止。每一处物 质集中时的区域范围都非常大，甚至可能超过数十万光年。如此庞大的区域，最终形成 的结构就是星系。 这段文字主要说的是：", "options": {"A": "星系是如何形成的", "B": "宇宙膨胀的物理过程", "C": "宇宙为什么会发生大爆炸", "D": "物质集中过程中的引力作用"}, "answer": "A"}, {"id": 9, "homework": 2, "homework_name": "课后作业2", "number": 1, "stem": "设计高度约为 1007 米的王国塔将于 2018 年落成，该塔将成为世界最高建筑。事 实上，王国塔最初的设计高度是 1500 米，自降近 500 米的原因是什么呢？主因就是风。 工程师威廉·勒迈苏尔指出，当地面上人们感觉清风拂面时，500 米高处其实已是狂风 呼啸。1978 年，纽约刚刚立起 278.9 米高的花旗集团中心大楼，正出自勒迈苏尔之手。 一位建筑系学生向他提了一个问题：楼这么高，有没有可能被风吹倒呢？勒迈苏尔惊出 一身冷汗，突然意识到，自己在设计时只考虑了垂直风向，45 度风向的影响被抛之脑 后！工作人员只得在半夜偷偷加班，焊上了防风支撑板，并且将这个秘密保守了 20 年。 这段文字意在说明：", "options": {"A": "建筑高度受制于风", "B": "勒迈苏尔的无心之过", "C": "世界最高建筑将超一千米", "D": "花旗集团中心大楼的独特之处"}, "answer": "A"}, {"id": 10, "homework": 2, "homework_name": "课后作业2", "number": 2, "stem": "人们通常以为人口爆炸是当今时代特有的现象，其实不然。生产技术获得重大突 破时，都会伴随着壮观的人口增长。原因很明显，技术的发展导致生产率的提高，从而 使能供养的人口大大增加。从旧石器时代初期到后期，技术初期的人口为 12.5 万人， 末期为 532 万人，增长了 40 倍以上，堪比后来随历次技术革命而出现的人口爆炸。 这段文字旨在说明：", "options": {"A": "古今人口变化规律的异同", "B": "人口增长与生产技术的关系", "C": "技术进步对人类的重要作用", "D": "旧石器时代人口规模变化趋势"}, "answer": "B"}, {"id": 11, "homework": 2, "homework_name": "课后作业2", "number": 3, "stem": "提升公民科学素质是加快经济发展方式转变的迫切要求。一个国家的核心竞争力 和强大后劲取决于包括科学素质在内的国民素质的不断提升，实施创新驱动发展战略， 把经济增长方式转移到推动科技进步和提高劳动者素质上来，需要有数以亿计的高素质 劳动者和数以千万计的能工巧匠。没有公民科学素质的普遍提高，就难以建立起庞大的 高素质劳动大军，难以将科学成果快速转化为现实的经济实力。 这段文字主要讨论的是：", "options": {"A": "公民科学素质同样是核心竞争力", "B": "时代呼唤高素质的劳动大军", "C": "经济发展方式转变是当务之急", "D": "推动科技成果转化为经济实力"}, "answer": "A"}, {"id": 12, "homework": 2, "homework_name": "课后作业2", "number": 4, "stem": "对微生物进行科学研究，需要超出常规的研究思路与工具。说到工具，很多人肯 定会首先想到显微镜，但显微镜只适合观察，如果要进行生化分析的话，琼脂的作用更 加重要。如果你去过微生物实验室，你会发现大家最常用的实验工具就是培养皿，里面 铺着一层富含营养的琼脂。每一个细菌都在琼脂表面单独长成一个肉眼可见的菌群，每 个菌群里含有成千上万个完全一样的细菌，这在生物学术语里叫做一个“克隆”。因为 琼脂是半固态的，细菌的位置被固定住了，无法在菌群之间自由往来，这就等于将一个 细菌克隆并扩增到足够大的量，却没有遭受其他细菌的污染。只有这样，科学家们才能 对其进行生化分析。 这段文字主要说明：", "options": {"A": "在微生物研究中显微镜的作用有限", "B": "琼脂在生化分析中发挥着重要作用", "C": "“克隆”技术使生化分析更具操作性", "D": "在实验室里科学家是如何进行生化分析的"}, "answer": "B"}, {"id": 13, "homework": 2, "homework_name": "课后作业2", "number": 5, "stem": "随着春节临近，各大互联网企业推出的五花八门的“手机抢红包”活动再度引发 各界关注。专家表示，作为近年来迅速兴起的一项“全民指尖新年俗”，手机红包已成 为当前几大互联网巨头的战略要地；而愈演愈烈的“红包大战”，实质则是互联网巨头 都不愿错过的一场用户之战、移动支付地位之战、生态场景之战。 最适合做这段文字标题的是：", "options": {"A": "“手机抢红包”内置的利益链", "B": "互联网企业黏住用户的新方式", "C": "红包大战背后的互联网巨头之争", "D": "手机红包缘何成为“全民指尖新年俗”"}, "answer": "C"}, {"id": 14, "homework": 2, "homework_name": "课后作业2", "number": 6, "stem": "中国古代称外国为“番”。出于表示尊敬、臣服等原因，这些番邦会派使节来朝 见皇帝。众多番邦使节云集朝堂，为了便于皇帝逐一认识，负责典礼的大臣就将各位使 节分成两列，皇帝按照先后次序，先左后右与使节寒暄交谈，依次类推。交谈之前，典 礼官都会报告这些番邦国家的称号，即所谓的“番号”，因此番号就有了依次编号的意 味。在现代汉语中，番号一般特指部队编号，主要是按照部队的性质、编制序列和数字 顺序授予的部队名号。 这段文字主要介绍了：", "options": {"A": "现代部队编号的起源", "B": "“番号”一词的来源及含义", "C": "古代番邦朝见的热闹场景", "D": "古代皇帝接待使节的礼仪程序"}, "answer": "B"}, {"id": 15, "homework": 2, "homework_name": "课后作业2", "number": 7, "stem": "在中国，让公众理解科学将是一个长期奋斗目标，除了科学界和教育界的参与， 除了更好地发挥现有科普资源的作用，眼下更需要做的一件事是职业科学普及工作者的 培养和扶持，包括一批科普作家队伍的造就。国际上的经验表明，一批职业科学普及撰 稿人的存在是科学普及的重要支撑，如果我们能抓紧培养一批职业的科学写作者，或许 能为我们的科学普及注入新的动力。 通过此段文字，作者意在：", "options": {"A": "阐明让公众理解科学是一项长期而艰巨的任务", "B": "介绍和评价国际上的新的科学普及方面的经验", "C": "呼吁尽快培养职业的科普作家和科普工作者", "D": "指出科普工作需要科学界教育界和公众的共同努力"}, "answer": "C"}, {"id": 16, "homework": 2, "homework_name": "课后作业2", "number": 8, "stem": "传统工艺是在民间生活中创造的，无论是趋利避害、迎祥祈福的装饰还是家居日 常的物件，传统工艺与日常生活融为一体，无处不在。如今，生活从传统走向现代，生 活方式发生了不小的变化，但我们仍然需要传承这样的生活艺术和生活智慧，复兴工艺 文化的创造力，创作生活之美。在现代经济全球一体化的背景下，文化更需要民族身份， 不能因为生活方式的转变而放弃了文化的基因，丢失了民族的记忆，特别是传统工艺中 所蕴含的“匠作精神”更是我们民族文化中宝贵的精神财富。 最适合做这段文字标题的是：", "options": {"A": "“生活之美”永流传", "B": "“匠作精神”不能丢", "C": "传统工艺的传承之路", "D": "传统工艺的生活美学"}, "answer": "B"}, {"id": 17, "homework": 3, "homework_name": "课后作业3", "number": 1, "stem": "黑洞是爱因斯坦广义相对论最不祥的预言：过多物质或能量集中在一处，终将导 致空间坍塌，像魔术师的外套一样吞进万物，万事万物皆逃不脱。直到 40 年前霍金博 士宣称颠覆了黑洞——或者可能是彻底推翻了。他的方程式表明：黑洞不会永存。一段 时间之后，它们会“泄掉”，然后爆炸成辐射和微粒。但是，有一个障碍：按照霍金的 估算，黑洞崩塌时散出的辐射是随机的，落入其中的万事万物的“信息”大部分将被抹 掉。这违反了现代物理学的一条原则：时间是可以扭转的，黑洞里发生过的事情可以重建。 这段文字的主旨是：", "options": {"A": "霍金发现了一条可以逃出黑洞的线索", "B": "黑洞终将“泄掉”，然后爆炸成辐射和微粒", "C": "霍金的研究结果彻底推翻了关于黑洞的预言", "D": "霍金破除了黑洞永存的预言却提出了新的挑战"}, "answer": "D"}, {"id": 18, "homework": 3, "homework_name": "课后作业3", "number": 2, "stem": "在整个地图学史上，有效使用地图意味着要看懂绘制在平面上的一系列抽象符号， 然后将这些符号与当地环境的各种三维特征联系起来，从而成功地确定自己的位置。但 这并不是所有普通人都能够做到的，而且不久之前，地图本身也还是一种稀缺的人工制 品，有些地图还属于军事上敏感的机密。但是，能够在手机屏幕上看到的地图改变了这 一切。 这段文字重在说明：", "options": {"A": "地图学发展经历了漫长的历史过程", "B": "地图绘制使用中存在诸多技术难题", "C": "智能手机的出现促进了地图学发展", "D": "智能手机大大提升了人类生活质量"}, "answer": "C"}, {"id": 19, "homework": 3, "homework_name": "课后作业3", "number": 3, "stem": "既然密封试卷对“高考”如此之公平，范仲淹、苏颂等人又为什么反对呢？他们 的观点如出一辙，那就是“高考”试卷密封只看试卷优劣，不看平时德才，这与如今一 些人的观点何等相似。但是，正像包拯反驳范仲淹说的那样：一个人的实际德行很难核 实，何况考官未必都能以公心取人，他们“或缘其雅素，或牵手爱憎，或迫于势要，或 通于贿赂”，很容易做出不公的事情，要想维护“至公”的“高考”手段，“高考”试 卷密封，依然势在必行。 通过这段文字，作者想要表达的意思是：", "options": {"A": "“高考”试卷密封制度有不可避免的缺陷", "B": "人才的选拔要注重对德才的考察", "C": "科举考官往往难以做到公平公正", "D": "相对而言“高考”试卷密封是较合理的制度"}, "answer": "D"}, {"id": 20, "homework": 3, "homework_name": "课后作业3", "number": 4, "stem": "在传统的学校中，每个教室孤立且封闭，教师们不会花什么时间来观察同事的教 学方法，或者向别人学习。然而，教育研究证实，当教师们相互协作时，学生们的表现 也相应更好。经济学家通过统计方法和大型数据库分析发现：当教师有机会与同事长期 合作、互相交流教学经验时，学生们在测试中得分较高。在一项针对美国教师的调查中， 超过 90%的受访人反映，同事之间的交流有助于提高自己的教学效果。 这段文字意在说明：", "options": {"A": "大数据研究对教育的启示", "B": "教师之间交流合作的意义", "C": "教学方法对学生表现的影响", "D": "传统学校中教师受到的限制"}, "answer": "B"}, {"id": 21, "homework": 3, "homework_name": "课后作业3", "number": 5, "stem": "民族的文化传统和历史的文化信息被大量地记载于历史经典文献中，但又不仅仅 局限于经典文献。除此之外，还有各种各样的历史文物，作为历史文化的载体被代以相 继地保存下来。传统村落就是这样一个历史文化载体，相对于经典文献和地下挖掘出来 的古物史料，传统村落所承载的有关中华民族文化的历史信息更具鲜活性，是我们中华 民族文明发展史的“实证”，是中华文明渊源有自的“活证”。我认为，它比文字、古 物更能真实地反映中华民族不同地域、不同族群的生产生活方式、道德伦理观念，以及 民族习俗风情。因此，我们有充分的理由重视传统村落，保护传统村落。 这段文字意在强调：", "options": {"A": "保护传统村落对于保护民族历史文化有着重要意义", "B": "应采取多种方式和途径传承、保护民族历史文化", "C": "传统村落是中华历史文化的重要载体和现实体现", "D": "传统村落文化较之经典文献更能鲜活地展现历史"}, "answer": "A"}, {"id": 22, "homework": 3, "homework_name": "课后作业3", "number": 6, "stem": "相对于政府公关，民间外交更具柔性，传播内容和载体更易于被接受，更能达到 “润物细无声”的效果。当前，越来越多外国民众来华参观访问，中国越来越多的公民 走出国门，网络媒体的发展也使普通公众更易影响舆论。因此要因势利导，通过新闻媒 体、社区组织、民间社团等渠道，引导国内公众主动配合公共外交，积极传播中国的文 化传统和价值理念，维护国家形象。 这段文字意在强调：", "options": {"A": "民间外交与政府公关的差别", "B": "民间外交在国际交往中的意义", "C": "应引导民间外交积极发挥作用", "D": "媒体应在国际交往中正确引导公众"}, "answer": "C"}, {"id": 23, "homework": 3, "homework_name": "课后作业3", "number": 7, "stem": "在物联网中，传感网的建设要求电子标签预先被嵌入任何与人息息相关的物品中。 可是，人们在观念上似乎还不能接受自己周围的物品甚至自己都时刻处于被监控的状态， 这直接导致嵌入标签会使个人的隐私受到侵犯。因此，如何确保标签物的拥有者个人隐 私不受侵犯便成为射频识别技术乃至物联网推广的关键问题。而且，一旦政府在这方面 和国外的大型企业合作，如何确保企业商业秘密、国家机密等不会泄露也至关重要。 这段文字意在说明：", "options": {"A": "应建立物联网电子标签的技术规范", "B": "应充分重视物联网的信息安全问题", "C": "应对物联网的国际合作进行必要监管", "D": "应尽快完善与物联网相关的法律法规"}, "answer": "B"}, {"id": 24, "homework": 3, "homework_name": "课后作业3", "number": 8, "stem": "如果处于静态环境，环境保护虽然短期内的确会造成企业的成本增加，但在动态 的竞争条件下，严格的环境保护从长期来看能够引发创新，抵消成本，这不但不会造成 企业成本增加，反而可能产生净收益，使企业在国际市场上更具竞争优势。因此，实施 适当的环境保护不仅不会伤害企业的竞争力，反而对其有益。 这段文字旨在说明：", "options": {"A": "静态环保与动态环保对企业的影响不同", "B": "要辩证地看待短期环保和企业发展的关系", "C": "应加大环保力度，想办法抵消环保的成本", "D": "合理的环境保护措施能够提升企业竞争力"}, "answer": "D"}, {"id": 25, "homework": 4, "homework_name": "课后作业4", "number": 1, "stem": "对于传统文化，我们过去经历过一个否定的过程，将其置于流行文化的反面，但 从来没有“无根”的流行文化。所谓流行文化，也不过是在对现代流行元素和传统文化 的结合与扬弃基础之上所形成的，特别是在传播技术日新月异的今天，传统文化与流行 文化的界限，已经越来越模糊。需要厘清的一点是，传统文化在今天所遭遇的压力，并 不是文化本身的危机，而主要是传播形式上的困境。立足这一点，创新传统文化的传播 形式，将之与流行文化元素和新技术相嫁接，就成为当下发展、弘扬和传播传统文化的 一个重要突破口。 这段文字意在说明：", "options": {"A": "流行文化要植根于传统文化", "B": "传统文化需要创新传播模式", "C": "传统文化与流行文化相辅相成", "D": "新技术模糊了传统与流行的界限"}, "answer": "B"}, {"id": 26, "homework": 4, "homework_name": "课后作业4", "number": 2, "stem": "近年，研究人员研发出了一种“人造皮肤”，能够模仿健康年轻皮肤的特点，有 望成为人类的“第二层皮肤”。“人造皮肤”交叉融合了医学、生物、化学、材料、工 程等多个学科，通过对材料的不断筛选、优化及临床测试，最终才取得这样的成果。现 实中，类似的成果还有很多，比如通过心脏外科医生与电气工程学家及计算机科学家的 紧密合作，利用 3D 打印将患者病变心脏的扫描成像转变成用于心脏手术的物理模型。 历史上，任何一项医疗技术和医疗器械创新都并非临床医生或某个学科专家单独完成的。 基于临床问题的多学科交叉合作，才能真正实现医疗技术和医疗器械领域的自主创新。 这段文字意在强调：", "options": {"A": "医疗自主创新促进多学科合作", "B": "医疗领域的自主创新成果显著", "C": "医疗技术和医疗器械难以创新", "D": "医疗自主创新依托多学科合作"}, "answer": "D"}, {"id": 27, "homework": 4, "homework_name": "课后作业4", "number": 3, "stem": "我国要在 21 世纪中叶建成世界科技强国，科学文化建设将在这个历史进程中扮 演非常重要的角色。在这个方面，我们有必要增强文化自信。文化自信不仅表现在对既 往文化贡献与价值的认同上，更表现在融汇各种优质的文化资源、创造新文化的信心和 决心上。尽管全面挖掘和传承我国传统文化中的科学因素、充分认识我国历史上对科学 发展做出的贡献十分必要，但更需要思考如何在未来的科学发展和科学文化建设上，做 出对世界有重要贡献的新成就，这应该是增强文化自信更重要的一个方面。 这段文字主要说的是：", "options": {"A": "文化自信表现在文化资源的整合和创新上", "B": "科学文化建设中增强文化自信的途径", "C": "科学文化发展是建设科技强国的核心", "D": "判断中国科学发展对世界所做贡献的标准"}, "answer": "B"}, {"id": 28, "homework": 4, "homework_name": "课后作业4", "number": 4, "stem": "流派的出现可以视作某艺术品种发展到高级阶段的表现，譬如京剧老生就有余派、 高派、马派等，京剧旦行的梅、尚、程、荀也更为人们所熟悉。京剧演员大多会根据自 身条件、喜好等，专攻某一流派，但如果对流派过于强调，反而会忽视了比流派更为基 本的行当规范。在很大程度上，流派是个人风格特色，而行当是基本技巧规范，是否符 合行当要求有严格的对错之分。没有行当规范就不可能有流派，不能用后者取代前者。 比如唱老生言派，首先应该符合老生行当的基本要求，然后再追求法度严谨的吐字发音、 起伏跌宕的运气行腔、细腻婉转的情感表达等言派特色。 这段文字意在说明：", "options": {"A": "流派传承应以行当规范为基础", "B": "流派往往是某一类风格的汇聚", "C": "戏剧流派脱离行当就难以发展", "D": "京剧传承应是技巧与特色并重"}, "answer": "A"}, {"id": 29, "homework": 4, "homework_name": "课后作业4", "number": 5, "stem": "自明清以来，大众对于国史最熟悉的段落，大概是“三国”，这主要得力于罗贯 中所写的史传文学《三国演义》。《三国演义》“据实指陈，非属臆造”，但题材取舍、 人物描写、故事演绎则广纳传说和野史素材，并借助艺术虚构。在受众那里，《三国演 义》经常被当作三国信史，故清代史家章学诚称其“七分实事，三分虚构，以至观者往 往为之惑乱”。这种“惑乱”，就是信史与史传文学两者间的矛盾性给读者带来的困惑。 “文”与“史”固然不可分家，但又不能混淆，也不能相互取代。一旦以“文”代“史”， 便会导致“惑乱”。 这段文字主要说的是：", "options": {"A": "史传文学的生命力在于适度的史学真实性", "B": "史传文学是文学性与史学价值的对立统一", "C": "人们应避免落入以“文”代“史”的窠臼", "D": "“文史分家”是评价史传文学的重要标准"}, "answer": "C"}, {"id": 30, "homework": 4, "homework_name": "课后作业4", "number": 6, "stem": "空气、水、土地是人类赖以生存的三大必需条件，然而相对于大气污染和水环境 污染，公众对土壤污染并不够重视，防治意识要弱很多，这很大程度上是由于土壤污染 具有隐蔽性、滞后性。雾霾来了我们能看到，河水变臭我们能闻到，可我们并不知道自 己吃的大米、蔬菜是在什么样的土里种出来的，含有什么不该有的元素。更可怕的是， 土壤污染一旦发生便很难恢复，如果今年这片地里种出的庄稼有毒，明年也必定带毒， 若想恢复如初，需要付出巨大的代价，需要经过漫长的时间。 这段文字意在强调：", "options": {"A": "土壤污染与其他生态污染有哪些不同", "B": "公众应重视土壤污染并提高防治意识", "C": "土壤污染危害的发现为何具有滞后性", "D": "土壤污染治理应舍得投入时间和财力"}, "answer": "B"}, {"id": 31, "homework": 4, "homework_name": "课后作业4", "number": 7, "stem": "虽然中国的救灾能力在经历过多次大型自然灾害后有了较大的提升，但是防灾教 育依然落后。中国扶贫基金会 2015 年对中国公众的防灾意识进行了调查，结果显示， 仅有 24.3%的城市居民表示关注灾害应对的相关知识，这一数据在农村仅为 11%。此外， 只有不到 4%的城市居民在日常生活中做到了基本的防灾准备，超过半数的农村居民从 未参加过任何防灾培训。形同虚设的防灾教育无法提高民众的自救能力，等到灾难发生 后才开始组织学习，逝去的生命已经无法挽回。 这段文字意在说明：", "options": {"A": "防灾教育比救灾更重要", "B": "中国的防灾教育亟待加强", "C": "防灾教育是提高自救能力的基础", "D": "城市与农村在防灾教育上严重失衡"}, "answer": "B"}, {"id": 32, "homework": 4, "homework_name": "课后作业4", "number": 8, "stem": "我曾经有一个坏习惯：不是在晚饭后坐在沙发上看手机，就是睡觉前躺在床上看 手机——打开微信，将当天的朋友圈从头看到尾，一直刷到没有新动态为止；打开微博， 看看谁因为什么又上了热搜榜；打开头条，看看它推送给我的星座分析……结果可想而 知，时间轻松被刷没，除了一堆无用的信息，我什么也没得到。 这段文字意在说明：", "options": {"A": "做没有意义的事无异于慢性自杀", "B": "不应沉迷于那些没有价值的信息", "C": "玩物丧志的说法是有一定道理的", "D": "智能手机使打发时间变得很容易"}, "answer": "B"}, {"id": 33, "homework": 5, "homework_name": "课后作业5", "number": 1, "stem": "在中国，“素人艺术”还是一个较为新鲜的概念。这个概念由法国艺术家让·杜 布菲提出的“原生艺术”概念衍生而来，指那些有精神疾患的人在无外界干扰的条件下 完全无意识的创作。这种创作由于纯粹性和高度自治性而获得了人们的关注。后来，这 个概念得到了衍生，所涵盖的范围更广，指没有受过系统专业的艺术训练、来自主流艺 术界之外的普通人的创作。他们的作品带着“野生”特性，显示出不同的艺术天赋。 这段文字主要介绍了“素人艺术”：", "options": {"A": "概念的由来与演变", "B": "在中西语境中的异同", "C": "被社会广泛接受的基础", "D": "对创作者艺术素养的要求"}, "answer": "A"}, {"id": 34, "homework": 5, "homework_name": "课后作业5", "number": 2, "stem": "权威检测机构的检测结果显示，节能灯的紫外线辐射的总能量只占节能灯释放总 能量的 6‰，即 15 瓦节能灯的紫外线功率仅为 0.09 瓦，而且节能灯里的长波紫外线不 会穿透人体的真皮层。一般来说，只要符合标准的合格节能灯，都能把紫外线辐射量控 制在安全范围内。此外，一个节能灯中仅有几毫克汞被封在灯里面，只有在一个很小的 密闭环境下，几百个灯同时碎掉，汞全被一个人吸入才有可能对人造成危害。这种事件 发生的概率几乎为零。 对文段的主要观点概括最准确的一项是：", "options": {"A": "权威机构关于节能灯安全的检测结论可信", "B": "人体的真皮层对紫外线具有自我隔离能力", "C": "正常情况下的节能灯不会对人体造成伤害", "D": "使用我国生产的节能灯不必担心安全问题"}, "answer": "C"}, {"id": 35, "homework": 5, "homework_name": "课后作业5", "number": 3, "stem": "从顶层设计上看，我国工匠精神培育建设需立足于搭建协同保障平台、开展不同 主体间的多元对话、建构产教研协同发展机制以及强化职业院校精神培育功能。从协同 发展的视角看，我国工匠精神的培养主体亟须根据自身的角色定位与职能属性，强化市 场管理制度，培育高品质消费市场，不断完善技术技能人员薪酬体系，构建职业院校、 实训中心、企业三站式互动机制。 这段文字意在说明：", "options": {"A": "我国工匠精神培育的主要策略", "B": "我国工匠精神培育的顶层设计", "C": "必须强化工匠精神培育工作的管理", "D": "搭建协同平台是工匠精神培育重心"}, "answer": "A"}, {"id": 36, "homework": 5, "homework_name": "课后作业5", "number": 4, "stem": "日本长野县从 1970 年至 2010 年气温上升了 1.3℃，青森县从 1975 年至 2010 年 气温上升了 1.2℃。在这段气温升高的时期，两地“富士”苹果的酸性成分含量平均减 少 15%，糖分含量则平均增加了 5%。南京农业大学葡萄种植专家研究发现，在光热条 件不同的地区种植的同一种葡萄，不仅口感不同，颜色也不同。比如红提，它种在新疆 是黑色的，但同样的品种拿到南京种植就是粉红色的，甜味也有所不同。不同年份的法 国葡萄酒价格会相差悬殊，原因就是不同年份的雨热条件不同，葡萄口感不同，酿出的 酒的口味也不同。 上文主要说明了：", "options": {"A": "随着全球气温变暖，很多水果都出现了甜度增加的趋势", "B": "气温上升影响水果的甜度和色泽", "C": "同一种水果品种在不同的地方种植，口味会发生变化", "D": "同一种水果品种在不同的地方种植，颜色会发生变化"}, "answer": "B"}, {"id": 37, "homework": 5, "homework_name": "课后作业5", "number": 5, "stem": "科学家在 100 亿光年外的星系里发现一颗超亮超新星，其爆发于宇宙大爆炸后约 35 亿年，正值天文学家所称的“宇宙正午”时期。普通超新星是大质量恒星死亡时发 生剧烈爆炸产生的。超亮超新星的亮度比普通超新星高 10 倍到 100 倍，目前还不太清 楚其形成机制。以往发现的超亮超新星所在星系质量都较小，使科学家认为小星系缺乏 重元素的环境有利于产生超亮超新星。此次发现的超亮超新星所在星系是普通的大质量 星系，使人重新思考超亮超新星的形成问题。这意味着银河系可能也拥有产生超亮超新 星的条件。 下列说法与原文相符的是：", "options": {"A": "超亮超新星产生于恒星形成最剧烈的“宇宙正午”时期", "B": "小星系缺乏重元素的环境事实上不利于产生超亮超新星", "C": "普通的大质量星系可能曾经拥有产生超亮超新星的条件", "D": "大质量恒星死亡时发生剧烈爆炸并不能产生超亮超新星"}, "answer": "C"}, {"id": 38, "homework": 5, "homework_name": "课后作业5", "number": 6, "stem": "地球南极的冰盖厚度达 4.8 公里，冰层的压力可以降低水的冰点，冰盖底部的温 度可以允许液态水体存在。利用雷达波可以探测到南极冰盖下面的液态水体。雷达主动 发射电磁波、并接收反射的回波。不同频率的电磁波具有不同的穿透能力，频率越低， 穿透的深度越大。当电磁波通过冰层向下传输时，它们会在不同物质之间的界面反射回 波，如冰层与基岩、含水的泥沙、液态水体之间的界面，都会反射回波。雷达沿着飞行 轨道前进，不断地进行测量，获得地下的图像。 下列说法与原文相符的是：", "options": {"A": "雷达是探测地下物体的最基本手段", "B": "电磁波的频率与穿透深度成反比", "C": "南极冰盖底部一定存在生命", "D": "电磁波在不同物质之间的反射回波相同"}, "answer": "B"}, {"id": 39, "homework": 5, "homework_name": "课后作业5", "number": 7, "stem": "有研究团队让 22 名 17 岁至 42 岁的志愿者在两周内每晚照常使用电子设备，但 在睡前佩戴三小时防蓝光眼镜，发现其晚间褪黑激素水平整体上升了大约 58%，上升 幅度甚至超过服用褪黑激素补充剂带来的变化。志愿者感觉睡眠质量改善，入睡更快， 整体睡眠时间延长。研究者说，最大的蓝光光源是日光，但大部分基于 LED 灯的设备 也会发出蓝光，“人造蓝光”会激活对褪黑激素有抑制作用的内在光敏视网膜神经节细 胞，从而干扰睡眠。该研究者建议睡前少用电子设备，或佩戴防蓝光眼镜。 从这段文字可以推出：", "options": {"A": "睡前不佩戴防蓝光眼镜会使褪黑激素水平整体上升", "B": "天然的日光并不会激活内在光敏视网膜神经节细胞", "C": "电子设备的蓝光会减少褪黑激素的分泌而促进睡眠", "D": "提升褪黑激素水平有助于入睡更快和睡眠质量改善"}, "answer": "D"}, {"id": 40, "homework": 5, "homework_name": "课后作业5", "number": 8, "stem": "朊病毒是结构异常的蛋白，能迫使正常蛋白呈现相同的错误折叠形状而像传染病 一样在组织中传播。这是继认识到细菌、病毒、支原体等微生物可以引发疾病后，人类 又发现的另一种引发疾病的病原体。因此，如果想要成功开发出有效的治疗方法，需要 针对（靶向）有活性的朊病毒而不是已经死亡的斑块和缠结物中的大量蛋白。 从这段文字中我们可以推出：", "options": {"A": "朊病毒的结构非常复杂", "B": "朊病毒比细菌危害更大", "C": "朊病毒能够引发疾病", "D": "朊病毒引发的疾病能够被有效治疗"}, "answer": "C"}, {"id": 41, "homework": 6, "homework_name": "课后作业6", "number": 1, "stem": "理解视知觉工作机制的传统观点可追溯至 16 世纪的法国哲学家笛卡尔。笛卡尔 认为，大脑会首先构建一个外部世界的镜像模型，之后在大脑内，我们像看电影一样观 察这个世界。据此观点，倒置眼镜会使内在的镜像模型也发生倒置，大脑根据这个倒置 的镜像产生视知觉。但是，越来越多的人开始质疑这一解释，德根纳就是其中一个。他 在实验进行到第 30 天时体验到的视觉现象使他彻底站到了笛卡尔镜像论的对立面。 接下来最可能讲述的是：", "options": {"A": "视知觉的工作机制", "B": "德根纳的实验结果", "C": "倒置眼镜的工作原理", "D": "笛卡尔镜像论的缺陷"}, "answer": "B"}, {"id": 42, "homework": 6, "homework_name": "课后作业6", "number": 2, "stem": "盐风化作用是指因岩石孔隙中的盐类结晶膨胀而导致的岩石露头表面颗粒分解 或脱落的物理风化作用，在地貌上表现为形成大小不等的风化穴，小的几厘米，大的可 达几米。盐风化现象在内陆干旱地区和海边表现更为明显，这是陆地上普遍存在的物理 风化作用，不仅会导致岩石表面的破碎分解，也会造成建筑石材的粉化脱落，而且在地 貌形态塑造过程中扮演着重要的角色。然而，它却一直受到地学界的忽视和误解，被解 释为风蚀或水蚀等其他作用的结果。 这段文字接下来最有可能论述的是：", "options": {"A": "盐风化作用对地貌所造成的危害", "B": "盐风化现象地理分布的相关特性", "C": "盐风化现象是如何被忽视误解的", "D": "盐风化现象形成的原因及其过程"}, "answer": "C"}, {"id": 43, "homework": 6, "homework_name": "课后作业6", "number": 3, "stem": "一个国家一旦登上发展的阶梯，公民的要求就会增加。这时政府只保证增加收入 是不够的，政府必须转变观念，从以物质为基础走向以规章为基础。针对亚太国家的研 究发现，国民对他们所接受的公共服务相关联的项目如教育、医疗和公共安全的满意度， 在他们对政府绩效的评价中占有重要的分量。近年来，亚洲国家对公共服务满意度的重 视程度日益提高，并且形成了一些富有特色的做法。 这段文字接下来最可能讲的是亚洲各国：", "options": {"A": "重视公共服务满意度的缘由", "B": "公民对公共服务满意度的数据", "C": "提高公共服务满意度的创新做法", "D": "公共服务满意度在政府绩效中的占比"}, "answer": "C"}, {"id": 44, "homework": 6, "homework_name": "课后作业6", "number": 4, "stem": "基础研究是整个科学体系的源头，是科技强国建设的根基。2018 年，我国全社会 研究与试验发展（R&D）经费约 1.94 万亿元，研发人员总量预计 418 万人，这些资源 如果得到合理配置，可以实现更大作为。据《2017 年全国科技经费投入统计公报》， 2017 年，我国基础研究经费 975.5 亿元，占 R&D 经费比重为 5.5%。虽然规模、强度近 几年在增长，但由于投入强度长期过低，加剧了基础研究资源配置的功利性，技术源头 缺失问题日益凸显，未来要实质性地强化基础研究多元投入体系，提高资源配置及使用 效率。 这段文字接下来最有可能讲述的是：", "options": {"A": "我国基础研究存在的问题", "B": "我国基础研究取得的进展", "C": "如何解决技术源头缺失问题", "D": "如何加强基础研究多元投入"}, "answer": "D"}, {"id": 45, "homework": 6, "homework_name": "课后作业6", "number": 5, "stem": "传统文化，其幽静深邃堪比深深庭院，正是因为有最单纯、最本初的文化热爱， 路过之人才愿意叩开门扉，一探究竟。以或萌或雅的方式吸引人来，只是极为关键的第 一步。而最终决定大家能在这庭院之中停留多久的，还是文化本身的魅力。因此，判断 文化创意产品是否成功，一条重要的原则就是看能否将________________融会贯通。 填入画横线部分最恰当的一项是：", "options": {"A": "幽静深邃的意蕴与单纯本初的文化热爱", "B": "传统文化的精神与国际潮流的一般走向", "C": "极为关键的萌感与停留心中的高雅文化", "D": "吸引人的巧妙形式与留住人的文化内核"}, "answer": "D"}, {"id": 46, "homework": 6, "homework_name": "课后作业6", "number": 6, "stem": "陨星体冲入地球大气圈的速度各有不同，这取决于________________。如果它正 对着地球运动，那么冲入的速度是最大的，可达到每秒 70 公里。这种迎面而来的陨星 体，即使有几万或几十万吨重，也会在地球大气圈中被完全破坏。相反，“追赶”地球 或被地球“追赶”的陨星体的冲入速度最小，每秒大约 11 公里。这种相对“慢”的陨 星体的残体，就能到达地球表面，成为陨石。 填入画横线部分最恰当的一句是：", "options": {"A": "陨星体的主要组成成份和质量", "B": "陨星体在星际空间中的初始速度", "C": "陨星体在星际空间的运动方向", "D": "陨星体与地球大气圈的摩擦面积"}, "answer": "C"}, {"id": 47, "homework": 6, "homework_name": "课后作业6", "number": 7, "stem": "小时候熟记的古诗文，长大后也很难忘记，即使长时间不用，但只要一提起，与 之相关的记忆便会不由自主地流露出来。这种扎根在脑海深处的诗词印象，是浸透在血 液之中的古文积淀，这就是“童子功”的厉害之处。因此，我们要从小诵读古诗文，让 中华传统文化内化于心。古人云，“________________”。想要练就古诗文的“童子功”， 必须要多读多记，才会烂熟于心、出口成章。若是腹内草莽，必然不可能口吐莲花。诗 词大会舞台上，选手们精彩表现的背后，又何尝不是他们从小的阅读背诵和长年的储存 积累。 填入画横线部分最恰当的一项是：", "options": {"A": "读书破万卷，下笔如有神", "B": "书犹药也，善读之可以医愚", "C": "问渠哪得清如许？为有源头活水来", "D": "熟读唐诗三百首，不会作诗也会吟"}, "answer": "D"}, {"id": 48, "homework": 6, "homework_name": "课后作业6", "number": 8, "stem": "20 世纪 30 年代，图灵提出计算机能够思维的观点，主张凡是能够通过“图灵测 试”的计算机就能够思维。所谓“图灵测试”，就是说一个人如果不能判断与之对话的 隐蔽主体是人还是机器，我们就不得不承认即便是机器也能思维。“图灵测试”能否判 断机器的思维，________________。如果将思维定义为计算过程，那么计算机当然能够 思维。这就是著名的“计算机隐喻”，即人是计算机，思维就是计算——这是计算表征 主义的核心思想。 填入画横线部分最恰当的一项是：", "options": {"A": "取决于如何定义计算机", "B": "取决于思维的活动过程", "C": "取决于计算机的功能配备", "D": "取决于我们如何定义思维"}, "answer": "D"}, {"id": 49, "homework": 7, "homework_name": "课后作业7", "number": 1, "stem": "①当时的塞纳省省长奥斯曼规划了一座地下之城，将巴黎发展成一座立体化的城 市 ②从中世纪延续而来的平面化城市已经难以满足经济社会飞速发展的新需要 ③后来，这个以下水道系统为基础的地下巴黎，随着公共产品种类的增加而不断添 入新功能 ④现在，地上的巴黎光彩照人，地下的巴黎默默付出，二者共同承载着这座千年古 都的迷人风情 ⑤城市形态由地上向地下延展，拓展了城市的空间 ⑥作为法国的政治、经济和文化中心，19 世纪的巴黎面临着一场迫切的现代化转型 将以上 6 个句子重新排列，语序正确的是：", "options": {"A": "①⑥④⑤②③", "B": "⑥②①⑤③④", "C": "②⑥④③⑤①", "D": "④⑥③⑤①②"}, "answer": "B"}, {"id": 50, "homework": 7, "homework_name": "课后作业7", "number": 2, "stem": "①所以，国务院印发了《2019 年全国减轻企业负担工作实施方案》 ②然而，近年来，一些地方政府拖欠相关方款项的新闻时有发生 ③一些地方政府、国企长期拖欠款项可能严重影响经济正常运行 ④除了政府，国有大型企业也时有拖欠民营企业款项的情况 ⑤提出今年的工作目标之一是持续推进清欠专项行动 ⑥现代经济运行中，政府部门被认为是信用最高的，有政府背书的单位在信用评级 中都享有较高的评级 将以上 6 个句子重新排列，语序正确的是：", "options": {"A": "③④①②⑥⑤", "B": "③①⑥②④⑤", "C": "⑥②④③①⑤", "D": "⑥②①③④⑤"}, "answer": "C"}, {"id": 51, "homework": 7, "homework_name": "课后作业7", "number": 3, "stem": "①它和金银、粮食一样作为重要财富，出现在历史的战争和商贸交易中，以其为 中心形成了庞大的经济圈 ②原来的骑兵和车夫虽然被替代了，但这些行当中相当一部分，转换为装甲兵和司 机等新行当，重新投入到社会进程中 ③随着科技的发展，这一现象彻底改变 ④同时，汽车和火车大大提高了运输能力和效率，助力石油等行业飞速发展，新的 就业机会大量涌现 ⑤人类在战争中开始使用更先进的坦克和装甲车，汽车和火车将马匹挤下主干道也 有 100 年左右的时间了 ⑥马匹在人类的社会进程中起到十分重要的作用 将以上 6 个句子重新排列，语序正确的一项是：", "options": {"A": "⑤④⑥③①②", "B": "⑤③①⑥④②", "C": "⑥③⑤①②④", "D": "⑥①③⑤②④"}, "answer": "D"}, {"id": 52, "homework": 7, "homework_name": "课后作业7", "number": 4, "stem": "①大约 10 年前，科学家对生物炭产生了兴趣 ②但这项技术渐渐被人遗忘，其他地方的农民则没有使用生物炭的习惯 ③现在，虽然这个想法已经渐渐淡出人们的视野，但土壤学家却开始探索将生物炭 用于农业以及治理污染 ④尽管农民们最近才开始接触生物炭，但实际上生物炭有着悠久的历史 ⑤千百年前，生活在亚马孙河流域的人们就通过加热有机物制造出了生物炭，并用 它造就了被称为“亚马孙黑土”的肥沃土壤 ⑥当时，人们开始关注全球变暖问题，一部分人期望可以用生物炭将大量碳元素封 存在地下 将以上 6 个句子重新排列，语序正确的是：", "options": {"A": "④⑤②①⑥③", "B": "④③①⑤⑥②", "C": "⑤①⑥④③②", "D": "⑤⑥②①③④"}, "answer": "A"}, {"id": 53, "homework": 7, "homework_name": "课后作业7", "number": 5, "stem": "①内圣外王：中国古代伦理思想中的一种理想人格 ②其具体内容随学派而异 ③语出《庄子·天下》篇 ④意为内修圣王之德，外施王者之政或外  "answer": "D"}, {"id": 79, "homework": 10, "homework_name": "课后作业10", "number": 7, "stem": "我们这一辈人所享受到的现代生活，就像一座越来越豪华、先进、舒适的大厦。 生活在这样一座大厦中，不能只是________。每个人不管这一辈子有多长，也不管是能 力大还是能力小，总要多多少少为这座大厦的发展和完善________，多多少少为这个世 界留下点什么。 填入画横线部分最恰当的一项是：", "options": {"A": "坐享其成    添砖加瓦", "B": "好逸恶劳   出谋划策", "C": "得过且过    竭尽全力", "D": "拈轻怕重   精益求精"}, "answer": "A"}, {"id": 80, "homework": 10, "homework_name": "课后作业10", "number": 8, "stem": "近几年，不少银行向影视业提供了较多的贷款支持，但迫切渴望融资渠道的中小 影视公司仍难以得到扶持，银行往往只是“________”。而私募基金投资影视业则是 “________”：尽管目前号称以影视产业为主要投资方向的基金已有近 20 只，声称募 集资金达 200 亿元，但披露的有影响力的投资项目却寥寥可数。 填入画横线部分最恰当的一项是：", "options": {"A": "借花献佛    小心翼翼", "B": "雪中送炭   纸上谈兵", "C": "点到为止    画饼充饥", "D": "锦上添花   雷大雨小"}, "answer": "D"}, {"id": 81, "homework": 11, "homework_name": "课后作业11", "number": 1, "stem": "用饮用水国家标准衡量矿物质水，这对企业本身或许是好事，因为这________着 它不需要执行一个非常严格的标准。而在矿泉水“标准门”事件之前，消费者对饮用水 安全性的________没有上升到一个很高的层面，所以对企业产品而言，只要符合国家标 准，就可以在市面上销售。 填入画横线部分最恰当的一项是：", "options": {"A": "意味   认知", "B": "标志   认识", "C": "预示   了解", "D": "暗示   理解"}, "answer": "A"}, {"id": 82, "homework": 11, "homework_name": "课后作业11", "number": 2, "stem": "在经济全球化时代，面对多元文化思潮的交流与交锋，人们常常有精神迷失的困 惑。如何________西方文化思潮的渗透，始终保持本民族的文化特色？如何实现精神富 有，________起源源不断的精神力量？这些都是当代文化发展需要深入思考的命题。 填入画横线部分最恰当的一项是：", "options": {"A": "抵挡   集聚", "B": "抵触   汇集", "C": "抵御   汇聚", "D": "抵制   积累"}, "answer": "C"}, {"id": 83, "homework": 11, "homework_name": "课后作业11", "number": 3, "stem": "法治是社会治理的基本规则，尤其是在全面依法治国新时代，任何人不管在线上 还是线下，都应遵守法律秩序。任何人都必须在法律和道德的________内对网络话语权 “轻拿轻放”，用谨言慎行守护________的网络空间和人间正道。 填入画横线部分最恰当的一项是：", "options": {"A": "原则   纤毫毕现", "B": "规则   正义凛然", "C": "架构   波澜不惊", "D": "框架   风清气正"}, "answer": "D"}, {"id": 84, "homework": 11, "homework_name": "课后作业11", "number": 4, "stem": "近年来，国家有关部门加大了对非法盗版活动的打击力度，通过建立群众举报、 定期检查等制度，有效________了非法盗版活动的势头。随着市场法律环境的日趋 ________，这种广大人民群众深恶痛绝的社会丑恶现象，终究会被根除。 填入画横线部分最恰当的一项是：", "options": {"A": "制止   完美", "B": "遏止   完备", "C": "扼制   完整", "D": "遏制   完善"}, "answer": "D"}, {"id": 85, "homework": 11, "homework_name": "课后作业11", "number": 5, "stem": "治理环境确为政府职责，环境出现问题，其监管________、执法不严难逃其责。 但是，当大家不断________政府不作为时，是不是也应该________一下自己：我们有没 有污染环境？ 填入画横线部分最恰当的一项是：", "options": {"A": "不当     谴责        检察", "B": "不周     斥责        检查", "C": "不善     苛责        检点", "D": "不力     指责        检讨"}, "answer": "D"}, {"id": 86, "homework": 11, "homework_name": "课后作业11", "number": 6, "stem": "对于许多人来说，“松花蛋含铅”的观念可谓________，这是因为，在松花蛋的 传统制作工艺中确实要用铅丹。不过，早在十几年前，我国就对松花蛋的制作工艺进行 了________。现在正规厂家生产的达标松花蛋，基本上都可以把铅含量控制在 0.1～0.2 毫克/千克。 填入画横线部分最恰当的一项是：", "options": {"A": "源远流长        改进", "B": "深入人心        改造", "C": "根深蒂固        改良", "D": "经久不衰        改善"}, "answer": "C"}, {"id": 87, "homework": 11, "homework_name": "课后作业11", "number": 7, "stem": "在新时代，我们要大力提升发展质量和效益，坚持质量第一、________质量变革、 ________质量优势、建设质量强国、________高质量发展。 填入画横线部分最恰当的一项是：", "options": {"A": "发动     增强        追求", "B": "提倡     增加        达到", "C": "推动     增强        实现", "D": "倡导     增加        完成"}, "answer": "C"}, {"id": 88, "homework": 11, "homework_name": "课后作业11", "number": 8, "stem": "亚洲是全球最具活力的地区之一，经济规模占世界的 1/3，人口有 40 多亿，劳动 力供给充足，后发优势明显，发展潜力远未________。同时，亚洲大多是发展中国家， 人均 GDP 不高，地区发展水平很不平衡，还有 7 亿多人生活在国际贫困线以下，发展 经济、改善民生的任务依然________。 填入画横线部分最恰当的一项是：", "options": {"A": "开发     艰难", "B": "解放     艰险", "C": "释放     艰巨", "D": "发挥     困难"}, "answer": "C"}, {"id": 89, "homework": 12, "homework_name": "课后作业12", "number": 1, "stem": "我国高校每年有数万项科研成果通过验收，其中有 30%以上的成果被鉴定为“国 际首创”、“国际领先”或者“填补了国内空白”。________的是，这些成果中只有极 少一部分转化为实际生产力，大部分成果只能“沉睡”在实验室和书斋中，高校科技研 究成果推广________。 填入画横线部分最恰当的一项是：", "options": {"A": "可悲     难以为继", "B": "遗憾     步履维艰", "C": "可惜     寸步难行", "D": "无奈     一筹莫展"}, "answer": "B"}, {"id": 90, "homework": 12, "homework_name": "课后作业12", "number": 2, "stem": "任正非引领华为走向成功，主要不是归功于华为的技术和实业，而是在于它的制 度。在于他能把________的高技术人才聚集于一个组织平台上的分配制度。中国改革开 放以来，高科技企业的利润分享已经成为一种新的制度安排。但是唯有任正非把这个利 润分享制度做到了极致，让几乎每个职工在企业中真实地感受到是为自己打工，任正非 这个制度创新无论怎样评价都不会过分，它的创新程度和先进程度令我国的国有企业 ________。 填入画横线部分最恰当的一项是：", "options": {"A": "成千上万        望尘莫及", "B": "数以千万        不可逾越", "C": "千千万万        望洋兴叹", "D": "不计其数        顾此失彼"}, "answer": "A"}, {"id": 91, "homework": 12, "homework_name": "课后作业12", "number": 3, "stem": "人工智能听起来很遥远，其实已经________到我们的日常工作和生活中了。人工 智能的应用，让生活更便捷、更有乐趣，节约时间、解放体力，甚至未来机器将________ 人类进行一些基础性的劳作，这个场景令人憧憬。 填入画横线部分最恰当的一项是：", "options": {"A": "渗透     替代", "B": "融入     协助", "C": "深入     取代", "D": "运用     辅助"}, "answer": "A"}, {"id": 92, "homework": 12, "homework_name": "课后作业12", "number": 4, "stem": "沿着卢瓦尔河，法国的历史被书写进河谷里________的城堡群中。想要探寻几百 年间法国乃至欧洲王宫贵胄间的权力斗争，窥视________的宫廷秘事，就要从走进这一 座座城堡开始。 填入画横线部分最恰当的一项是：", "options": {"A": "鳞次栉比        不可捉摸", "B": "星罗棋布        波诡云谲", "C": "浩如烟海        变幻莫测", "D": "不计其数        变幻无常"}, "answer": "B"}, {"id": 93, "homework": 12, "homework_name": "课后作业12", "number": 5, "stem": "对人类而言，环境发挥两方面的功能。一方面是人类生存与发展的物质来源，另 一方面它承受着各种人类活动所产生的________。这种功能决定了人类自身的活动越来 越强烈地影响着环境的发展过程。因此，人类必须彻底地________利己主义，保护好环 境，保持同环境和谐与协调的互利关系。 填入画横线部分最恰当的一项是：", "options": {"A": "后果     扬弃", "B": "结果     摒弃", "C": "效果     唾弃", "D": "恶果     遗弃"}, "answer": "B"}, {"id": 94, "homework": 12, "homework_name": "课后作业12", "number": 6, "stem": "随着人工智能技术的不断发展，简单重复或危险的作业将由机器执行，低端蓝领、 白领阶层可能会被人工智能________。未来人工智能对职场很可能产生颠覆性影响。 填入画横线部分最恰当的一项是：", "options": {"A": "鸠占鹊巢", "B": "更弦易辙", "C": "取而代之", "D": "越俎代庖"}, "answer": "C"}, {"id": 95, "homework": 12, "homework_name": "课后作业12", "number": 7, "stem": "在西班牙，“慢食”一直是在人们头脑中________的饮食观念。与“慢食”一脉 相承的是西班牙人“慢生活”的态度：大厦电梯里面没有关门按键，大家都是等待电梯 门缓缓关上；和午餐相伴的还有午睡，尤其在西班牙南部最为炎热的地方，小店业主都 会在 14 点到 17 点之间关门，那是他们________的午休时段。 填入画横线部分最恰当的一项是：", "options": {"A": "嗤之以鼻        板上钉钉", "B": "坚不可摧        不可更改", "C": "积重难返        翘首以待", "D": "根深蒂固        雷打不动"}, "answer": "D"}, {"id": 96, "homework": 12, "homework_name": "课后作业12", "number": 8, "stem": "新媒体的发展，尤其是自媒体的兴起，挑战着传统的新闻生产机制，在信息超载 的同时，使新闻生产“去中心化”，新闻流动的把关功能________，不实消息________ 网络。弥尔顿设想的“意见的自由市场”的自净功能并未实现，很多情况下谣言往往 “________”真相。 填入画横线部分最恰当的一项是：", "options": {"A": "消减     充满     淡化", "B": "降低     充盈     消溶", "C": "消弱     充溢     消淡", "D": "减弱     充斥     稀释"}, "answer": "D"}];

let fQs=[], idx=0, ua={}, sa={};

function init(){
  const hs=new Set(Q.map(q=>q.homework));
  const sel=document.getElementById('hw-select');
  [...hs].sort((a,b)=>a-b).forEach(h=>{
    const o=document.createElement('option');
    o.value=h;o.textContent='课后作业'+h+'（'+Q.filter(q=>q.homework===h).length+'题）';
    sel.appendChild(o);
  });
  try{const s=JSON.parse(localStorage.getItem('yyqx3')||'{}');ua=s.ua||{};sa=s.sa||{}}catch(e){}
  apply();
}
function apply(){
  const v=document.getElementById('hw-select').value;
  fQs=v==='all'?[...Q]:Q.filter(q=>q.homework===parseInt(v));
  idx=0;upStats();render();renderSum();
}
document.getElementById('hw-select').addEventListener('change',apply);

function upStats(){
  const t=fQs.length,a=fQs.filter(q=>ua[q.id]!==undefined).length;
  const c=fQs.filter(q=>ua[q.id]===q.answer).length;
  document.getElementById('s-total').textContent='共 '+t+' 题';
  document.getElementById('s-done').textContent='已答 '+a;
  document.getElementById('s-ok').textContent='正确 '+c;
  document.getElementById('s-rate').textContent='正确率 '+(a>0?Math.round(c/a*100):0)+'%';
  document.getElementById('pfill').style.width=t>0?(a/t*100)+'%':'0%';
}

function render(){
  const a=document.getElementById('qarea');
  if(!fQs.length){a.innerHTML='<div class="empty"><div class="icon">📭</div><p>暂无题目</p></div>';document.getElementById('nav').style.display='none';return}
  document.getElementById('nav').style.display='flex';
  const q=fQs[idx],u=ua[q.id],sh=sa[q.id],ok=u===q.answer;
  let tag='阅读理解';
  const s=q.stem;
  if(s.includes('填入画横线部分最恰当')||s.includes('填入划横线部分最恰当'))tag='逻辑填空';
  else if(s.includes('意在说明')||s.includes('意在阐明')||s.includes('意在强调')||s.includes('重在说明')||s.includes('作者意在'))tag='意图推断';
  else if(s.includes('主要说明')||s.includes('主要介绍')||s.includes('主要讨论')||s.includes('主要说')||s.includes('旨在说明')||s.includes('主旨'))tag='主旨概括';
  else if(s.includes('标题'))tag='标题选择';
  else if(s.includes('接下来'))tag='下文推断';
  else if(s.includes('语句填空'))tag='语句填空';
  else if(s.includes('句子重新排列'))tag='语句排序';
  else if(s.includes('与原文相符'))tag='细节理解';
  else if(s.includes('可以推出'))tag='细节推断';
  
  let h='<div class="q-card"><div class="q-header"><span class="q-badge">'+q.homework_name+' 第'+q.number+'题</span><span class="q-type">'+tag+'</span><span class="q-num">#'+(idx+1)+' / '+fQs.length+'</span></div><div class="q-stem">'+esc(q.stem)+'</div><div class="options">';
  ['A','B','C','D'].forEach(l=>{
    let cls='opt';
    if(u===l&&sh)cls+=l===q.answer?' correct':' wrong';
    else if(u===l)cls+=' selected';
    h+='<div class="'+cls+'" onclick="pick('+q.id+',\''+l+'\')" id="o'+q.id+'-'+l+'"><span class="opt-letter">'+l+'</span><span class="opt-text">'+esc(q.options[l]||'')+'</span></div>';
  });
  h+='</div>';
  if(sh)h+=ok?'<div class="feedback ok show">✅ 正确！答案：'+q.answer+'</div>':'<div class="feedback err show">❌ 错误。你的答案：'+u+'，正确答案：'+q.answer+'</div>';
  h+='</div>';
  a.innerHTML=h;
  document.getElementById('btn-ans').textContent=sh?'🔒 隐藏答案':'💡 显示答案';
  document.getElementById('btn-ans').style.display=u?'inline-block':'none';
  window.scrollTo({top:0,behavior:'smooth'});
  upStats();
}

function pick(qid,l){
  if(sa[qid])return;
  ua[qid]=l;save();
  ['A','B','C','D'].forEach(x=>{
    const el=document.getElementById('o'+qid+'-'+x);
    if(el){el.classList.remove('selected','correct','wrong');if(x===l)el.classList.add('selected')}
  });
  document.getElementById('btn-ans').style.display='inline-block';
  document.getElementById('btn-ans').textContent='💡 显示答案';
  upStats();renderSum();

  // 检查当前作业是否全部完成
  var curQ = fQs[idx];
  var hwQs = fQs.filter(function(q){return q.homework===curQ.homework;});
  var hwDone = hwQs.filter(function(q){return ua[q.id]!==undefined;});
  var isLastInHw = idx===fQs.length-1 || fQs[idx+1].homework!==curQ.homework;

  if(hwDone.length===hwQs.length && isLastInHw){
    // 当前作业全部完成，弹窗结算，不自动跳转
    var hwCorrect = hwQs.filter(function(q){return ua[q.id]===q.answer;}).length;
    var msg = '📋 课后作业'+curQ.homework+' 完成！\\n\\n✅ 正确：'+hwCorrect+' / '+hwQs.length+'\\n📊 正确率：'+Math.round(hwCorrect/hwQs.length*100)+'%';
    setTimeout(function(){alert(msg);},300);
  }else{
    setTimeout(function(){nextQ();},400);
  }
}

function toggleAns(){
  if(!fQs.length)return;
  const q=fQs[idx];if(!ua[q.id])return;
  sa[q.id]=!sa[q.id];save();render();renderSum();
}

function nextQ(){if(idx<fQs.length-1){idx++;render()}}
function prevQ(){if(idx>0){idx--;render()}}
function randQ(){if(fQs.length){idx=Math.floor(Math.random()*fQs.length);render()}}

function resetAll(){
  if(!confirm('确定要重置当前筛选下的所有答题进度吗？'))return;
  fQs.forEach(q=>{delete ua[q.id];delete sa[q.id]});
  save();idx=0;render();renderSum();
}

function renderSum(){
  const sum=document.getElementById('sum');
  const t=fQs.length,a=fQs.filter(q=>ua[q.id]!==undefined).length;
  const c=fQs.filter(q=>ua[q.id]===q.answer).length,w=a-c;
  if(!a){sum.classList.remove('show');return}
  sum.classList.add('show');
  let h='<h2>📊 答题统计</h2><div class="summary-grid"><div class="summary-item"><div class="num">'+t+'</div><div class="label">总题数</div></div><div class="summary-item"><div class="num">'+a+'</div><div class="label">已答题</div></div><div class="summary-item ok-bg"><div class="num">'+c+'</div><div class="label">正确</div></div><div class="summary-item err-bg"><div class="num">'+w+'</div><div class="label">错误</div></div><div class="summary-item"><div class="num">'+(a>0?Math.round(c/a*100):0)+'%</div><div class="label">正确率</div></div></div>';
  h+='<div class="hw-breakdown"><h3>📋 各作业详情</h3>';
  [...new Set(fQs.map(q=>q.homework))].sort((a,b)=>a-b).forEach(hw=>{
    const qs=fQs.filter(q=>q.homework===hw),cc=qs.filter(q=>ua[q.id]===q.answer).length;
    const p=Math.round(cc/qs.length*100),bc=p>=80?'#27ae60':p>=60?'#f39c12':'#e74c3c';
    h+='<div class="hw-row"><span class="hw-name">课后作业'+hw+'</span><div class="hw-bar"><div class="hw-fill" style="width:'+p+'%;background:'+bc+'"></div></div><span class="hw-score">'+cc+'/'+qs.length+' ('+p+'%)</span></div>';
  });
  h+='</div>';sum.innerHTML=h;
}

function save(){try{localStorage.setItem('yyqx3',JSON.stringify({ua:ua,sa:sa}))}catch(e){}}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')nextQ();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')prevQ();
  if(e.key==='r'||e.key==='R')randQ();
  const q=fQs[idx];if(!q)return;
  if(e.key==='a'||e.key==='A')pick(q.id,'A');
  if(e.key==='b'||e.key==='B')pick(q.id,'B');
  if(e.key==='c'||e.key==='C')pick(q.id,'C');
  if(e.key==='d'||e.key==='D')pick(q.id,'D');
  if(e.key==='Enter')toggleAns();
});

init();

</script>
</body>
</html>
