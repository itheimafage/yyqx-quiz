<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>黔东南事业单位综合知识 · 刷题模式</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333;line-height:1.6;-webkit-tap-highlight-color:transparent}
.header{background:linear-gradient(135deg,#1a3c5e,#2980b9);color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:1.1rem;margin-bottom:4px}
.stats{display:flex;justify-content:space-around;background:#fff;padding:12px 8px;border-bottom:1px solid #e8e8e8;position:sticky;top:56px;z-index:99;font-size:.82rem}
.stat-item{text-align:center}.stat-item .val{font-size:1.2rem;font-weight:700;color:#2980b9}.stat-item .label{color:#888;font-size:.72rem}
.filters{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.filters button{padding:6px 14px;border:1px solid #ddd;border-radius:16px;background:#fff;font-size:.78rem;cursor:pointer;flex-shrink:0}
.filters button.on{background:#2980b9;color:#fff;border-color:#2980b9}
.progress-bar{height:3px;background:#eee}.progress-bar .fill{height:100%;background:linear-gradient(90deg,#27ae60,#2ecc71);transition:width .3s}
.question-area{padding:16px 12px 80px;max-width:640px;margin:0 auto}
.q-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.q-num{font-weight:700;color:#2c3e50;font-size:.95rem}
.q-year{padding:2px 8px;border-radius:10px;font-size:.7rem;color:#fff;background:#2980b9}
.q-type{padding:2px 8px;border-radius:10px;font-size:.7rem;color:#fff;background:#8e44ad}
.q-text{font-size:.92rem;margin-bottom:12px;color:#333}
.options{display:flex;flex-direction:column;gap:8px}
.option{padding:12px;border:2px solid #e8e8e8;border-radius:10px;cursor:pointer;transition:all .2s;font-size:.88rem;position:relative}
.option:active{background:#f0f8ff}
.option.selected{border-color:#2980b9;background:#e8f4fd}
.option.correct{border-color:#27ae60;background:#f0fff4;color:#27ae60}
.option.wrong{border-color:#e74c3c;background:#fff5f5;color:#e74c3c}
.option .check{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:700}
.submit-btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#2980b9,#1a6daa);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:16px;transition:opacity .2s}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.submit-btn:active:not(:disabled){opacity:.8}
.explanation{display:none;margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;font-size:.84rem;border-left:3px solid #27ae60}
.explanation.show{display:block}
.explanation b{color:#27ae60}
.nav-btns{display:flex;gap:10px;margin-top:12px}
.nav-btn{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:.85rem;cursor:pointer;text-align:center}
.nav-btn:active{background:#f0f0f0}
.nav-btn.primary{background:#2980b9;color:#fff;border-color:#2980b9}
.result-card{display:none;text-align:center;padding:30px 20px;background:#fff;border-radius:12px;margin-bottom:16px}
.result-card.show{display:block}
.result-card .score{font-size:2.5rem;font-weight:700;color:#2980b9}
.result-card .detail{margin-top:8px;color:#666;font-size:.9rem}
.empty-state{text-align:center;padding:40px 20px;color:#999}
</style>
</head>
<body>

<div class="header">
  <h1>📚 黔东南事业单位综合知识 · 刷题</h1>
  <p style="font-size:.75rem;opacity:.8">近5年真题 · 交互作答 · 即时反馈</p>
</div>

<div class="stats">
  <div class="stat-item"><div class="val" id="answered">0</div><div class="label">已答</div></div>
  <div class="stat-item"><div class="val" id="correct">0</div><div class="label">正确</div></div>
  <div class="stat-item"><div class="val" id="accuracy">0%</div><div class="label">正确率</div></div>
  <div class="stat-item"><div class="val" id="remaining">143</div><div class="label">剩余</div></div>
</div>

<div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>

<div class="filters" id="filters">
  <button class="on" data-filter="all">全部</button>
  <button data-filter="single">单选</button>
  <button data-filter="multi">多选</button>
  <button data-filter="judge">判断</button>
  <button data-filter="fill">填空</button>
  <button data-filter="short">简答</button>
  <button data-filter="essay">论述</button>
  <button data-filter="case">案例</button>
</div>

<div class="question-area" id="questionArea">
  <div class="result-card" id="resultCard">
    <div style="font-size:1.1rem;font-weight:600;margin-bottom:8px">📊 答题统计</div>
    <div class="score" id="finalScore">0%</div>
    <div class="detail" id="finalDetail">已完成 0 / 143 题</div>
    <button class="submit-btn" style="margin-top:16px;max-width:200px;margin-left:auto;margin-right:auto" onclick="resetAll()">重新开始</button>
  </div>
  <div id="questionContainer"></div>
</div>

<script>
// 题目数据（从原始HTML提取）
const questions = [
  // 单选题 1-74
  {id:1,type:'single',year:'2021',q:'国家主席习近平于2021年9月15日到驻陕西部队某基地视察调研时强调，要聚焦备战打仗，注重发展指挥等现代信息化手段，结合地方特色。这体现了（）的关系。',opts:['A. 思维和存在的关系','B. 矛盾的主要方面和次要方面','C. 主要矛盾和次要矛盾','D. 矛盾的绝对性和相对性'],ans:'D',exp:'矛盾具有绝对性和相对性。注重现代信息化手段体现了矛盾的绝对性，结合地方特色体现了矛盾的相对性。'},
  {id:2,type:'single',year:'2021',q:'价值转化为价格的前提条件是（）。',opts:['A. 劳动产品成为商品','B. 货币出现','C. 私有制产生','D. 社会分工'],ans:'A',exp:'价值是凝结在商品中的无差别人类劳动，劳动产品只有成为商品才具有价值并转化为价格。'},
  {id:3,type:'single',year:'2021',q:'十九大报告中提到，（）是近代以来中华民族伟大复兴的三大里程碑。',opts:['A. 建立中国共产党、成立中华人民共和国、推进改革开放和中国特色社会主义事业','B. 辛亥革命、新中国成立、改革开放','C. 五四运动、新中国成立、改革开放','D. 中国共产党成立、抗日战争胜利、新中国成立'],ans:'A',exp:'十九大报告明确三大里程碑。'},
  {id:4,type:'single',year:'2021',q:'患者在诊疗活动中受到损害，医疗机构不承担赔偿责任的是（）。',opts:['A. 医务人员在抢救垂危患者时已尽到合理诊疗义务','B. 患者对医务人员执业资格有异议','C. 限于当时医疗水平难以诊疗','D. 患者不配合医疗机构诊疗'],ans:'B',exp:'《民法典》第1224条规定三种免责情形：①患者不配合；②紧急抢救已尽合理义务；③限于当时医疗水平。B不在此列。'},
  {id:5,type:'single',year:'2021',q:'出租车司机为救伤者违章驾驶，发生事故后应如何处理？（）',opts:['A. 综合分析不同价值观做出判断','B. 司机违章仅受罚款','C. 应主要使用道德手段解决','D. 法律价值之间没有冲突'],ans:'A',exp:'法的价值具有冲突性，需综合考量生命权与交通秩序等不同法价值之间关系。'},
  {id:6,type:'single',year:'2022',q:'二十大报告指出，中国共产党的中心任务是（）。',opts:['A. 团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴','B. 全面建成小康社会','C. 实现共同富裕','D. 建设社会主义现代化国家'],ans:'A',exp:'二十大报告明确中心任务。'},
  {id:7,type:'single',year:'2022',q:'资本是能带来剩余价值的价值附着物。剩余价值的产生是因为（）。',opts:['A. 劳动力成为特殊商品','B. 机器设备先进','C. 资本家善于经营','D. 市场供求关系'],ans:'A',exp:'劳动力成为商品是剩余价值产生的前提条件，劳动力能创造比自身价值更大的价值。'},
  {id:8,type:'single',year:'2022',q:'二十大报告指出，要坚持（）加强党的思想建设。',opts:['A. 用党的创新理论武装全党','B. 加强组织建设','C. 推进反腐倡廉','D. 完善制度体系'],ans:'A',exp:'二十大报告强调用党的创新理论武装全党是思想建设的根本任务。'},
  {id:9,type:'single',year:'2022',q:'基本经济制度探索主要体现为（）。',opts:['A. 公有制为主体、多种所有制经济共同发展','B. 社会主义市场经济体制','C. 按劳分配为主体','D. 改革开放'],ans:'A',exp:'公有制为主体、多种所有制经济共同发展是我国基本经济制度的核心内容。'},
  {id:10,type:'single',year:'2022',q:'根据公共管理学知识，属于提供公共物品的是（）。',opts:['A. 私人医院服务','B. 社会保障和福利','C. 餐饮服务','D. 咨询服务'],ans:'B',exp:'公共物品具有非排他性和非竞争性，社会保障和福利属于公共物品。'},
  {id:11,type:'single',year:'2023',q:'"新事物必然战胜旧事物"体现的是（）原理。',opts:['A. 发展原理','B. 否定之否定原理','C. 对立统一规律','D. 普遍联系原理'],ans:'A',exp:'发展的实质是新事物的产生和旧事物的灭亡，新事物战胜旧事物是发展的必然规律。'},
  {id:12,type:'single',year:'2023',q:'关于关系的客观性，下列说法正确的是（）。',opts:['A. 客观关系由个人主观决定','B. 人可以随意创造客观关系','C. 客观关系不以人的意志为转移','D. 客观关系会随时代变化而消失'],ans:'C',exp:'关系具有客观性，是事物本身固有的联系，不以人的意志为转移。'},
  {id:13,type:'single',year:'2023',q:'习总书记强调全面依法治国要抓重点，抓重点就是（）。',opts:['A. 加强党的领导','B. 健全法律制度体系','C. 提升司法公信力','D. 建设法治政府'],ans:'B',exp:'健全法律制度体系是全面依法治国的重点。'},
  {id:14,type:'single',year:'2023',q:'下列关于黔东南州的说法，错误的是（）。',opts:['A. 黔东南是全国苗族侗族人口最集中的地区','B. 镇远古城位于黔东南州','C. 黔东南有"歌舞海洋"的美誉','D. 黔东南州府凯里市是贵州省的省会'],ans:'D',exp:'贵州省省会是贵阳市，凯里市是黔东南苗族侗族自治州的州府。'},
  {id:15,type:'single',year:'2023',q:'社会主义金融市场的基础是（）。',opts:['A. 资金市场','B. 证券市场','C. 外汇市场','D. 期货市场'],ans:'A',exp:'资金市场（货币市场和资本市场）是金融市场的基础。'},
  {id:16,type:'single',year:'2024',q:'党的二十大报告指出，以（）全面推进中华民族伟大复兴。',opts:['A. 中国特色社会主义道路','B. 中国式现代化','C. 高质量发展','D. 改革开放'],ans:'B',exp:'二十大明确以中国式现代化全面推进中华民族伟大复兴。'},
  {id:17,type:'single',year:'2024',q:'下列属于我国国家机构组织和活动原则的是（）。',opts:['A. 人民主权原则','B. 民主集中制原则','C. 社会主义法治原则','D. 以上都是'],ans:'D',exp:'我国国家机构的组织和活动原则包括人民主权、民主集中制、社会主义法治等原则。'},
  {id:18,type:'single',year:'2024',q:'下列行政处罚中属于行为罚的是（）。',opts:['A. 行政拘留','B. 罚款','C. 责令停产停业','D. 没收违法所得'],ans:'C',exp:'行为罚是限制或剥夺违法者特定行为能力的处罚。A人身罚，B、D财产罚。'},
  {id:19,type:'single',year:'2024',q:'下列诗句与季节对应正确的是（）。',opts:['A. "接天莲叶无穷碧，映日荷花别样红"——春季','B. "停车坐爱枫林晚，霜叶红于二月花"——秋季','C. "忽如一夜春风来，千树万树梨花开"——春季','D. "墙角数枝梅，凌寒独自开"——夏季'],ans:'B',exp:'A为夏季荷花，B为秋季枫叶，C为冬季雪景（以梨花喻雪），D为冬季梅花。'},
  {id:20,type:'single',year:'2024',q:'下列不属于我国四大名著的是（）。',opts:['A. 《三国演义》','B. 《封神演义》','C. 《水浒传》','D. 《红楼梦》'],ans:'B',exp:'四大名著为《三国演义》《水浒传》《西游记》《红楼梦》。《封神演义》不在其列。'},
  {id:21,type:'single',year:'2024',q:'以下属于可再生能源的是（）。',opts:['A. 煤炭','B. 石油','C. 天然气','D. 太阳能'],ans:'D',exp:'太阳能可不断再生利用。煤炭、石油、天然气为非可再生化石能源。'},
  {id:22,type:'single',year:'2024',q:'市场机制的核心机制是（）。',opts:['A. 价格机制','B. 供求机制','C. 竞争机制','D. 风险机制'],ans:'A',exp:'价格机制是市场机制中最核心的机制，通过价格信号引导资源配置。'},
  {id:23,type:'single',year:'2024',q:'下列关于公文格式的说法，正确的是（）。',opts:['A. 公文必须加盖印章','B. 发文字号由发文机关代字、年份、发文顺序号组成','C. 公文的主送机关必须是一个','D. 公文的成文日期以印发日期为准'],ans:'B',exp:'A错误，普发性公文可不盖印；C错误，可多个主送；D错误，成文日期以签发日期为准。'},
  {id:24,type:'single',year:'2024',q:'下列关于道德的说法，错误的是（）。',opts:['A. 道德是一种社会意识形态','B. 道德通过社会舆论、传统习惯和内心信念来维系','C. 道德具有强制性','D. 道德是调整人与人、人与社会关系的行为规范'],ans:'C',exp:'道德不具有国家强制性，靠内心信念和舆论维系。法律才具有国家强制性。'},
  {id:25,type:'single',year:'2024',q:'社会主义核心价值观中，国家层面的价值目标是（）。',opts:['A. 富强、民主、文明、和谐','B. 自由、平等、公正、法治','C. 爱国、敬业、诚信、友善','D. 公平、正义、团结、友爱'],ans:'A',exp:'国家层面：富强民主文明和谐；社会层面：自由平等公正法治；个人层面：爱国敬业诚信友善。'},
  {id:26,type:'single',year:'2024',q:'下列不属于贵州世界自然遗产地的是（）。',opts:['A. 荔波喀斯特','B. 赤水丹霞','C. 梵净山','D. 黄果树瀑布'],ans:'D',exp:'黄果树瀑布为国家级风景名胜区，非世界自然遗产。ABC均为世界自然遗产。'},
  {id:27,type:'single',year:'2024',q:'马克思主义哲学的直接理论来源是（）。',opts:['A. 古希腊罗马哲学','B. 德国古典哲学','C. 英国古典政治经济学','D. 英法空想社会主义'],ans:'B',exp:'德国古典哲学（黑格尔辩证法、费尔巴哈唯物主义）是马克思主义哲学的直接理论来源。'},
  {id:28,type:'single',year:'2024',q:'下列体现"实践是认识的基础"这一观点的是（）。',opts:['A. 秀才不出门，全知天下事','B. 纸上得来终觉浅，绝知此事要躬行','C. 人有多大胆，地有多大产','D. 人的理性为自然界立法'],ans:'B',exp:'B出自陆游，强调亲身实践的重要性。A强调间接经验；C是主观唯心主义；D是康德唯心主义观点。'},
  {id:29,type:'single',year:'2024',q:'下列关于通货膨胀的说法，正确的是（）。',opts:['A. 通货膨胀是指物价水平持续下降','B. 通货膨胀会导致货币贬值','C. 通货膨胀有利于债权人','D. 抑制通胀应采取扩张性财政政策'],ans:'B',exp:'通胀指物价持续上涨，货币购买力下降即贬值。A错；C通胀利于债务人；D应用紧缩性政策。'},
  {id:30,type:'single',year:'2024',q:'东航（）2024年1月9日开始执行上海虹桥至北京大兴航线商业航班。',opts:['A. 沈括号大飞机','B. C919大飞机','C. AG600大飞机','D. G20大飞机'],ans:'B',exp:'C919是国产大飞机，2024年1月执飞第二条定期商业航线。'},
  {id:31,type:'single',year:'2024',q:'农业农村部消息，2023年脱贫劳动力务工总规模达（）人。',opts:['A. 3000万','B. 3200万','C. 3397万','D. 3500万'],ans:'C',exp:'2023年脱贫劳动力务工总规模达3397万人。'},
  {id:32,type:'single',year:'2024',q:'2022年3月18日，我国海拔最高的百万千瓦级水电站（）6台机组全部投产发电。',opts:['A. 白鹤滩水电站','B. 乌东德水电站','C. 溪洛渡水电站','D. 两河口水电站'],ans:'D',exp:'两河口水电站位于四川雅江县，海拔约3000米，是我国海拔最高的百万千瓦级水电站。'},
  {id:33,type:'single',year:'2024',q:'"四史"间的逻辑关系：①是②源头③④是②成果。①②③④分别是（）。',opts:['A. 党史/社会主义发展史/新中国史/改革开放史','B. 党史/新中国史/社会主义发展史/改革开放史','C. 新中国史/党史/改革开放史/社会主义发展史','D. 社会主义发展史/党史/新中国史/改革开放史'],ans:'A',exp:'党史是社会主义发展史的源头，新中国史和改革开放史是社会主义发展史的重大成果。'},

// 状态管理
let currentIndex = 0;
let selectedOptions = [];
let answered = {};
let correctCount = 0;
let currentFilter = 'all';

// 获取过滤后的题目
function getFilteredQuestions() {
  if (currentFilter === 'all') return questions;
  return questions.filter(q => q.type === currentFilter);
}

// 渲染题目
function renderQuestion() {
  const filtered = getFilteredQuestions();
  if (filtered.length === 0) {
    document.getElementById('questionContainer').innerHTML = '<div class="empty-state">该分类下暂无题目</div>';
    return;
  }
  
  if (currentIndex >= filtered.length) currentIndex = filtered.length - 1;
  if (currentIndex < 0) currentIndex = 0;
  
  const q = filtered[currentIndex];
  const isAnswered = answered[q.id];
  const container = document.getElementById('questionContainer');
  
  let html = `<div class="q-card">
    <div class="q-header">
      <span class="q-num">第${currentIndex + 1}题</span>
      <span class="q-year">${q.year}</span>
      <span class="q-type">${getTypeName(q.type)}</span>
    </div>
    <div class="q-text">${q.q}</div>`;
  
  if (q.type === 'single' || q.type === 'multi') {
    html += '<div class="options">';
    q.opts.forEach((opt, idx) => {
      const letter = String.fromCharCode(65 + idx);
      let cls = 'option';
      if (isAnswered) {
        if (q.ans.includes(letter)) cls += ' correct';
        else if (selectedOptions.includes(letter) && !q.ans.includes(letter)) cls += ' wrong';
      } else if (selectedOptions.includes(letter)) {
        cls += ' selected';
      }
      html += `<div class="${cls}" onclick="selectOption('${letter}')" ${isAnswered ? 'style="pointer-events:none"' : ''}>
        ${opt}${isAnswered && q.ans.includes(letter) ? '<span class="check">✓</span>' : ''}${isAnswered && selectedOptions.includes(letter) && !q.ans.includes(letter) ? '<span class="check">✗</span>' : ''}
      </div>`;
    });
    html += '</div>';
  } else if (q.type === 'judge') {
    html += '<div class="options">';
    ['✓', '✗'].forEach(opt => {
      let cls = 'option';
      if (isAnswered) {
        if (q.ans === opt) cls += ' correct';
        else if (selectedOptions.includes(opt) && q.ans !== opt) cls += ' wrong';
      } else if (selectedOptions.includes(opt)) {
        cls += ' selected';
      }
      html += `<div class="${cls}" onclick="selectOption('${opt}')" ${isAnswered ? 'style="pointer-events:none"' : ''}>
        ${opt === '✓' ? '正确' : '错误'}${isAnswered && q.ans === opt ? '<span class="check">✓</span>' : ''}${isAnswered && selectedOptions.includes(opt) && q.ans !== opt ? '<span class="check">✗</span>' : ''}
      </div>`;
    });
    html += '</div>';
  } else if (q.type === 'fill' || q.type === 'short' || q.type === 'essay' || q.type === 'case') {
    html += `<div style="padding:12px;background:#f8f9fa;border-radius:8px;margin-bottom:8px">
      <textarea id="answerInput" placeholder="请输入你的答案..." style="width:100%;min-height:80px;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:.88rem;resize:vertical" ${isAnswered ? 'disabled' : ''}></textarea>
    </div>`;
  }
  
  if (isAnswered) {
    html += `<div class="explanation show">
      <b>📖 答案：${q.ans}</b>
      ${q.exp ? `<div style="margin-top:6px;color:#666">${q.exp}</div>` : ''}
      ${q.type !== 'single' && q.type !== 'multi' && q.type !== 'judge' ? `<div style="margin-top:6px;color:#666"><b>参考答案：</b>${q.ans}</div>` : ''}
    </div>`;
  }
  
  if (!isAnswered) {
    html += `<button class="submit-btn" id="submitBtn" onclick="submitAnswer()">提交答案</button>`;
  }
  
  html += `<div class="nav-btns">
    <button class="nav-btn" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled style="opacity:.5"' : ''}>上一题</button>
    <button class="nav-btn primary" onclick="nextQuestion()" ${currentIndex === filtered.length - 1 ? 'disabled style="opacity:.5"' : ''}>下一题</button>
  </div></div>`;
  
  container.innerHTML = html;
  updateStats();
}

function getTypeName(type) {
  const map = {single:'单选',multi:'多选',judge:'判断',fill:'填空',short:'简答',essay:'论述',case:'案例'};
  return map[type] || type;
}

function selectOption(opt) {
  const q = getFilteredQuestions()[currentIndex];
  if (answered[q.id]) return;
  
  if (q.type === 'single') {
    selectedOptions = [opt];
  } else if (q.type === 'multi') {
    const idx = selectedOptions.indexOf(opt);
    if (idx > -1) selectedOptions.splice(idx, 1);
    else selectedOptions.push(opt);
  } else if (q.type === 'judge') {
    selectedOptions = [opt];
  }
  renderQuestion();
}

function submitAnswer() {
  const filtered = getFilteredQuestions();
  const q = filtered[currentIndex];
  
  if (answered[q.id]) return;
  
  if (q.type === 'fill' || q.type === 'short' || q.type === 'essay' || q.type === 'case') {
    const input = document.getElementById('answerInput');
    if (!input || !input.value.trim()) {
      alert('请先输入答案再提交');
      return;
    }
  } else if (selectedOptions.length === 0) {
    alert('请先选择答案再提交');
    return;
  }
  
  answered[q.id] = true;
  
  // 判分
  if (q.type === 'single' || q.type === 'judge') {
    if (selectedOptions[0] === q.ans) correctCount++;
  } else if (q.type === 'multi') {
    const sorted = [...selectedOptions].sort().join('');
    if (sorted === q.ans) correctCount++;
  }
  
  selectedOptions = [];
  renderQuestion();
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    selectedOptions = [];
    renderQuestion();
  }
}

function nextQuestion() {
  const filtered = getFilteredQuestions();
  if (currentIndex < filtered.length - 1) {
    currentIndex++;
    selectedOptions = [];
    renderQuestion();
  }
}

function updateStats() {
  const total = questions.length;
  const answeredCount = Object.keys(answered).length;
  const accuracy = answeredCount > 0 ? Math.round(correctCount / answeredCount * 100) : 0;
  const remaining = total - answeredCount;
  
  document.getElementById('answered').textContent = answeredCount;
  document.getElementById('correct').textContent = correctCount;
  document.getElementById('accuracy').textContent = accuracy + '%';
  document.getElementById('remaining').textContent = remaining;
  document.getElementById('progressFill').style.width = (answeredCount / total * 100) + '%';
}

function resetAll() {
  if (confirm('确定要重新开始吗？所有答题记录将被清除。')) {
    currentIndex = 0;
    selectedOptions = [];
    answered = {};
    correctCount = 0;
    renderQuestion();
  }
}

// 筛选按钮事件
document.getElementById('filters').addEventListener('click', function(e) {
  if (e.target.tagName === 'BUTTON') {
    document.querySelectorAll('#filters button').forEach(b => b.classList.remove('on'));
    e.target.classList.add('on');
    currentFilter = e.target.dataset.filter;
    currentIndex = 0;
    selectedOptions = [];
    renderQuestion();
  }
});

// 初始化
renderQuestion();
</script>
</body>
